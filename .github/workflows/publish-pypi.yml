name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Validate release target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Manual publish is only allowed from main."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Resolve package version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("src/adanos_cli/__init__.py").read_text(encoding="utf-8")
          print(re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "Tag version ($TAG) does not match package version ($VERSION)."
              exit 1
            fi
          fi

      - name: Install dependencies
        run: |
          python -m pip install ".[dev]"
          python -m pip install pipx

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Smoke test built CLI package
        run: |
          python -m pip uninstall -y adanos-cli || true
          python -m pipx install dist/adanos_cli-*.whl --force
          command -v adanos
          adanos --output json --version > /tmp/adanos-version.json
          adanos --output json capabilities > /tmp/adanos-capabilities.json
          python - <<'PY'
          import json
          from pathlib import Path

          version_payload = json.loads(Path("/tmp/adanos-version.json").read_text(encoding="utf-8"))
          assert version_payload["name"] == "adanos-cli"
          assert version_payload["version"]

          capabilities_payload = json.loads(Path("/tmp/adanos-capabilities.json").read_text(encoding="utf-8"))
          assert capabilities_payload["name"] == "adanos-cli"
          assert "consensus" in capabilities_payload["commands"]
          assert "plugins" in capabilities_payload["commands"]
          PY

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
