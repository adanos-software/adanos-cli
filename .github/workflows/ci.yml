name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Prepare Python SDK dependency
        run: |
          if python -m pip install "adanos>=2.3.0,<3"; then
            echo "Using published adanos SDK dependency."
          else
            git clone --depth 1 --branch codex/api-1.37.0-sync https://github.com/adanos-software/adanos-python-sdk.git /tmp/adanos-python-sdk
            python -m pip install build
            python -m build --wheel --outdir "$PWD/.tmp-sdk-wheels" /tmp/adanos-python-sdk
            python -m pip install --find-links "$PWD/.tmp-sdk-wheels" "adanos>=2.3.0,<3"
          fi

      - name: Install dependencies
        run: |
          if [ -d "$PWD/.tmp-sdk-wheels" ]; then
            python -m pip install --find-links "$PWD/.tmp-sdk-wheels" ".[dev]"
          else
            python -m pip install ".[dev]"
          fi

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build wheel and sdist
        run: |
          rm -rf dist
          python -m build

      - name: Smoke install with pipx
        run: |
          python -m pip install pipx
          python -m pipx ensurepath
          python -m pip uninstall -y adanos-cli
          pipx_args=()
          if [ -d "$PWD/.tmp-sdk-wheels" ]; then
            pipx_args=(--pip-args="--find-links=$PWD/.tmp-sdk-wheels")
          fi
          python -m pipx install dist/adanos_cli-*.whl "${pipx_args[@]}"
          command -v adanos
          adanos --version
          adanos --output json capabilities
